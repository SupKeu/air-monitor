<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Воздух дома</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f1720;--mute:#6b7686;--lime:#d9f86a;--line:#e8ecf1;--soft:#f6f8fa}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,"Segoe UI",sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:22px 20px 56px}
header{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:9px;font-weight:600}
.logo i{width:22px;height:22px;border-radius:7px;background:var(--ink);display:grid;place-items:center}
.logo i:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--lime)}
.live{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--mute)}
.live b{width:8px;height:8px;border-radius:50%;background:#b4bdc9}
.live.on b{background:#3fbf5f;box-shadow:0 0 0 4px rgba(63,191,95,.2)}
h1{font-weight:500;font-size:clamp(1.9rem,5.4vw,2.9rem);letter-spacing:-.02em;line-height:1.1;margin-top:44px}
h1 em,h2 em{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400;letter-spacing:0}
#msg{margin-top:12px;font-size:.9rem;color:#a31515}
#msg:empty{display:none}
.hero{margin-top:34px}
.lab{color:var(--mute);font-size:.95rem}
.big{display:flex;align-items:baseline;gap:10px;margin-top:4px}
.big span{font-size:clamp(4.6rem,17vw,8.5rem);font-weight:500;letter-spacing:-.05em;line-height:1}
.big small{font-size:1.2rem;color:var(--mute)}
.scale{position:relative;height:6px;border-radius:6px;margin-top:22px;background:linear-gradient(90deg,#8fd14f 0 32%,#e8b020 32% 48%,#ef7a3c 48% 80%,#dc4040 80% 100%)}
.scale i{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--ink);transform:translate(-50%,-50%);transition:left .6s ease}
.ticks{position:relative;height:18px;margin-top:8px;font-size:.75rem;color:var(--mute)}
.ticks span{position:absolute;transform:translateX(-50%)}
.p{display:inline-block;font-size:.78rem;padding:3px 11px;border-radius:999px}
.p.good{background:var(--lime);color:#2f5d08}.p.mid{background:#fdeebb;color:#8a5a00}
.p.bad{background:#fed9c6;color:#a43a08}.p.vbad{background:#fccaca;color:#a31515}.p.neu{background:#eef2f7;color:var(--mute)}
.card{margin-top:40px;border:1px solid var(--line);border-radius:24px;padding:18px 18px 14px}
.tabs{display:inline-flex;flex-wrap:wrap;background:var(--soft);border-radius:999px;padding:4px;gap:2px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:999px;font:inherit;font-size:.85rem;color:var(--mute);cursor:pointer}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,23,32,.14)}
.tabs button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#chart{margin-top:14px}
#chart svg{width:100%;height:auto;display:block;touch-action:pan-y}
.gl{stroke:var(--line);stroke-width:1}.tl{stroke:#aab4c1;stroke-width:1;stroke-dasharray:3 3}
.ax{font-size:11px;fill:var(--mute)}.tt{font-size:12px;fill:var(--ink);font-weight:500;paint-order:stroke;stroke:#fff;stroke-width:4px}
.empty{padding:44px 0;text-align:center;color:var(--mute);font-size:.92rem}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:6px;font-size:.85rem;color:var(--mute)}
.stats b{color:var(--ink);font-weight:500}
.note{font-size:.78rem;color:var(--mute);margin-top:10px}
.note:empty{display:none}
h2{font-size:1.4rem;font-weight:500;letter-spacing:-.01em;margin:44px 0 14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.t{border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;align-items:flex-start}
.t .nm{font-size:.85rem;color:var(--mute)}
.t .v{font-size:1.8rem;font-weight:500;letter-spacing:-.02em;margin-top:6px}
.t .v small{font-size:.8rem;color:var(--mute);font-weight:400;margin-left:3px;letter-spacing:0}
.t .p{margin-top:10px}
footer{text-align:center;color:var(--mute);font-size:.8rem;margin-top:40px}
</style></head><body><div class="wrap">
<header><div class="logo"><i></i>Воздух дома</div><div class="live" id="live"><b></b><span id="state">Загрузка…</span></div></header>
<h1 id="h1">Воздух дома <em>загружается</em></h1>
<div id="msg"></div>
<section class="hero">
 <div class="lab">Углекислый газ</div>
 <div class="big"><span id="co">—</span><small>ppm</small></div>
 <div style="margin-top:12px"><span class="p neu" id="cop">нет данных</span></div>
 <div class="scale"><i id="mk" style="left:0"></i></div>
 <div class="ticks"><span style="left:32%">800</span><span style="left:48%">1200</span><span style="left:80%">2000</span></div>
</section>
<section class="card">
 <div class="tabs" id="tabs"></div>
 <div id="chart"></div>
 <div class="stats" id="stats"></div>
 <div class="note" id="note"></div>
</section>
<h2>Другие <em>показатели</em></h2>
<div class="tiles" id="more"></div>
<footer id="foot"></footer>
</div>
<script>
const $=id=>document.getElementById(id);
const DEMO=location.search.includes('demo');
const N=['good','mid','bad','vbad'];
const TXT={good:'Отлично',mid:'Умеренно',bad:'Плохо',vbad:'Очень плохо'};
const WORD={good:'отличный',mid:'умеренный',bad:'плохой',vbad:'очень плохой'};
const AQI={level_1:'good',level_2:'good',level_3:'mid',level_4:'bad',level_5:'vbad',level_6:'vbad'};
const CT={good:'Комфортно',mid:'Приемлемо',bad:'Некомфортно'};
const lvl=(v,l)=>{for(let i=0;i<l.length;i++)if(v<=l[i])return N[i];return 'vbad'};
const comfort=(v,a,b,c,d)=>v>=a&&v<=b?'good':(v>=c&&v<=d?'mid':'bad');
const TABS={
 co2_value:{n:'CO₂',u:'ppm',f:v=>v},
 pm25_value:{n:'PM2.5',u:'мкг/м³',f:v=>v},
 temp_current:{n:'Температура',u:'°C',f:v=>v/10},
 humidity_value:{n:'Влажность',u:'%',f:v=>v/10}
};
let TAB='co2_value';
const DEMOD={online:true,status:[{code:'air_quality_index',value:'level_1'},{code:'temp_current',value:236},{code:'humidity_value',value:452},{code:'co2_value',value:612},{code:'ch2o_value',value:9},{code:'voc_value',value:23},{code:'pm25_value',value:15},{code:'pm1',value:10},{code:'pm10',value:17},{code:'battery_percentage',value:100},{code:'charge_state',value:false}]};

function tile(name,val,unit,cls,txt){
 return `<div class="t"><div class="nm">${name}</div><div class="v">${val}<small>${unit}</small></div>${txt?`<span class="p ${cls||'neu'}">${txt}</span>`:''}</div>`;
}

/* локальная история (запасной вариант) */
function saveLocal(m){
 try{
  const a=JSON.parse(localStorage.getItem('air_hist')||'[]'),now=Date.now();
  const o={t:now};Object.keys(TABS).forEach(k=>{if(m[k]!==undefined)o[k]=m[k]});
  a.push(o);
  localStorage.setItem('air_hist',JSON.stringify(a.filter(p=>now-p.t<864e5).slice(-3000)));
 }catch(e){}
}
function localPts(k){
 try{return JSON.parse(localStorage.getItem('air_hist')||'[]').filter(p=>p[k]!==undefined).map(p=>[p.t,TABS[k].f(p[k])])}catch(e){return []}
}
function demoPts(k){
 const b={co2_value:620,pm25_value:14,temp_current:23.5,humidity_value:45}[k],a={co2_value:220,pm25_value:6,temp_current:1.5,humidity_value:6}[k];
 return Array.from({length:144},(_,i)=>[Date.now()-864e5+i*6e5,b+a*Math.sin(i/14)+a*.3*Math.sin(i/3.1)]);
}

async function loadHist(){
 const k=TAB;let pts=null,note='';
 if(DEMO)pts=demoPts(k);
 else{
  try{
   const r=await fetch('/api/history?code='+k),d=await r.json();
   if(r.ok&&d.points&&d.points.length>1)pts=d.points.map(p=>[p[0],TABS[k].f(p[1])]);else throw 0;
  }catch(e){pts=localPts(k);note='История из облака Tuya недоступна. График строится из данных, пока эта страница открыта.'}
 }
 if(k===TAB)draw(pts,note);
}

function draw(pts,note){
 $('note').textContent=note||'';
 const el=$('chart');
 if(!pts||pts.length<2){el.innerHTML='<div class="empty">Пока мало данных для графика. Загляните позже.</div>';$('stats').innerHTML='';return}
 const T=TABS[TAB],W=720,H=250,pl=44,pr=10,pt=12,pb=26,t1=Date.now(),t0=t1-864e5;
 const vs=pts.map(p=>p[1]);let lo=Math.min(...vs),hi=Math.max(...vs);
 const mn=lo,mx=hi,av=vs.reduce((a,b)=>a+b,0)/vs.length;
 if(hi-lo<1){hi+=1;lo-=1}
 const pad=(hi-lo)*.15;lo-=pad;hi+=pad;
 const x=t=>pl+(Math.max(t,t0)-t0)/(t1-t0)*(W-pl-pr),y=v=>pt+(1-(v-lo)/(hi-lo))*(H-pt-pb);
 const fmt=v=>(hi-lo)<20?v.toFixed(1):String(Math.round(v));
 const hm=t=>new Date(t).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
 let g='';
 for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3,yy=y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" class="gl"/><text x="${pl-8}" y="${yy+4}" text-anchor="end" class="ax">${fmt(v)}</text>`}
 for(let i=0;i<=4;i++){const t=t0+i*216e5;g+=`<text x="${x(t)}" y="${H-6}" text-anchor="${i==0?'start':(i==4?'end':'middle')}" class="ax">${hm(t)}</text>`}
 const line=pts.map((p,i)=>(i?'L':'M')+x(p[0]).toFixed(1)+' '+y(p[1]).toFixed(1)).join('');
 const area=line+`L${x(pts[pts.length-1][0]).toFixed(1)} ${H-pb}L${x(pts[0][0]).toFixed(1)} ${H-pb}Z`;
 el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" id="svg" role="img" aria-label="График за 24 часа">${g}<path d="${area}" fill="rgba(217,248,106,.4)"/><path d="${line}" fill="none" stroke="#0f1720" stroke-width="2" stroke-linejoin="round"/><g id="tip" style="display:none"><line id="tl" y1="${pt}" y2="${H-pb}" class="tl"/><circle id="tc" r="5" fill="#fff" stroke="#0f1720" stroke-width="2"/><text id="tt" class="tt" text-anchor="middle"></text></g></svg>`;
 const svg=$('svg');
 svg.addEventListener('pointermove',e=>{
  const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W;
  let best=pts[0],bd=1e18;
  for(const p of pts){const d=Math.abs(x(p[0])-px);if(d<bd){bd=d;best=p}}
  const cx=x(best[0]),cy=y(best[1]);
  $('tip').style.display='';
  $('tl').setAttribute('x1',cx);$('tl').setAttribute('x2',cx);
  $('tc').setAttribute('cx',cx);$('tc').setAttribute('cy',cy);
  const tt=$('tt');tt.setAttribute('x',Math.min(Math.max(cx,80),W-80));tt.setAttribute('y',pt+12);
  tt.textContent=fmt(best[1])+' '+T.u+', '+hm(best[0]);
 });
 svg.addEventListener('pointerleave',()=>{$('tip').style.display='none'});
 $('stats').innerHTML=`<span>Минимум <b>${fmt(mn)}</b></span><span>Среднее <b>${fmt(av)}</b></span><span>Максимум <b>${fmt(mx)}</b></span><span>${T.u}, за 24 часа</span>`;
}

function render(d){
 const m={};d.status.forEach(s=>m[s.code]=s.value);
 $('live').className='live'+(d.online?' on':'');
 $('state').textContent=d.online?'Монитор онлайн':'Монитор офлайн';
 const co=m.co2_value,cc=co!==undefined?lvl(co,[800,1200,2000]):null,g=cc||AQI[m.air_quality_index];
 $('h1').innerHTML='Воздух дома <em>сейчас '+(g?WORD[g]:'в норме')+'</em>';
 if(co!==undefined){
  $('co').textContent=co;
  $('cop').className='p '+cc;$('cop').textContent=TXT[cc];
  $('mk').style.left=Math.min(co/2500,1)*100+'%';
 }
 let mt='';
 if(m.pm25_value!==undefined){const c=lvl(m.pm25_value,[15,35,75]);mt+=tile('PM2.5',m.pm25_value,'мкг/м³',c,TXT[c])}
 if(m.pm10!==undefined){const c=lvl(m.pm10,[45,100,150]);mt+=tile('PM10',m.pm10,'мкг/м³',c,TXT[c])}
 if(m.pm1!==undefined){const c=lvl(m.pm1,[15,35,75]);mt+=tile('PM1',m.pm1,'мкг/м³',c,TXT[c])}
 if(m.temp_current!==undefined){const t=m.temp_current/10,c=comfort(t,20,25,18,27);mt+=tile('Температура',t.toFixed(1),'°C',c,CT[c])}
 if(m.humidity_value!==undefined){const h=m.humidity_value/10,c=comfort(h,40,60,30,70);mt+=tile('Влажность',h.toFixed(1),'%',c,CT[c])}
 if(m.ch2o_value!==undefined){const c=lvl(m.ch2o_value,[30,60,100]);mt+=tile('Формальдегид',m.ch2o_value,'мкг/м³',c,TXT[c])}
 if(m.voc_value!==undefined)mt+=tile('Летучие вещества',m.voc_value,'','','');
 if(m.battery_percentage!==undefined){const b=m.battery_percentage,c=b>30?'good':(b>15?'mid':'bad');mt+=tile('Батарея',b,'%',c,m.charge_state?'Заряжается':'')}
 $('more').innerHTML=mt;
 $('foot').textContent='Обновлено в '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+'. Страница обновляется сама каждые 30 секунд.';
 if(!DEMO)saveLocal(m);
}

async function load(){
 try{
  const d=DEMO?DEMOD:await (await fetch('/api/air')).json();
  if(d.error||!d.status){$('msg').textContent='Не удалось получить данные: '+(d.msg||d.error||'неизвестная ошибка');return}
  $('msg').textContent='';render(d);loadHist();
 }catch(e){$('msg').textContent='Нет связи с сервером. Обновите страницу.'}
}
$('tabs').innerHTML=Object.keys(TABS).map(k=>`<button data-k="${k}" class="${k==TAB?'on':''}">${TABS[k].n}</button>`).join('');
$('tabs').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 TAB=b.dataset.k;
 document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
 loadHist();
});
load();setInterval(load,30000);
</script></body></html>
